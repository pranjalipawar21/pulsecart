<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#D64E12" />
    <meta name="description" content="PulseCart — Retail Intelligence Dashboard. Live GMV, ML forecasting, sentiment analysis and GST compliance for Indian e-commerce." />

    <!-- Open Graph -->
    <meta property="og:title"       content="PulseCart Retail Intelligence" />
    <meta property="og:description" content="Live GMV · ML Forecasting · Sentiment · GST Compliance" />
    <meta property="og:type"        content="website" />

    <!-- Preconnect for font performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- IBM Plex Sans — loaded here so it's available before React hydrates -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon inline SVG — no file needed -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23D64E12'/><text y='.9em' font-size='70' font-family='sans-serif' fill='white' x='15'>P</text></svg>" />

    <title>PulseCart — Retail Intelligence</title>

    <style>
      /* Prevent flash of unstyled content */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: #F7F8FC;
        font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }

      /* Loading spinner shown before React mounts */
      #initial-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #F7F8FC;
        z-index: 9999;
        transition: opacity 0.3s;
      }
      #initial-loader .logo {
        width: 44px; height: 44px; border-radius: 12px;
        background: linear-gradient(135deg, #D64E12, #E8920A);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 22px; font-weight: 700;
        margin-bottom: 18px;
      }
      #initial-loader .label {
        font-size: 13px; color: #6B7A99; font-weight: 500;
        letter-spacing: 0.02em;
      }
      #initial-loader .spinner {
        width: 20px; height: 20px;
        border: 2px solid #E2E8F4;
        border-top-color: #D64E12;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-bottom: 14px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <!-- Pre-React loader — hidden once App mounts -->
    <div id="initial-loader">
      <div class="logo">P</div>
      <div class="spinner"></div>
      <div class="label">Connecting to Firebase…</div>
    </div>

    <div id="root"></div>

    <!-- Hide loader once React is ready -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var observer = new MutationObserver(function () {
          var root   = document.getElementById('root');
          var loader = document.getElementById('initial-loader');
          if (root && root.children.length > 0 && loader) {
            loader.style.opacity = '0';
            setTimeout(function () { loader.style.display = 'none'; }, 300);
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
  </body>
</html>
